<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Doctor Fab feeling words ocean</title>
  <desc id="desc">A calm coastal word ocean grouping feeling categories into waves and tide pools.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fffdf9"/>
      <stop offset="0.48" stop-color="#fbf7f1"/>
      <stop offset="1" stop-color="#e9f4f2"/>
    </linearGradient>
    <linearGradient id="water" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#8fb9b7" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#254f5c" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#153947" stop-opacity="0.38"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#153947" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1400" height="900" fill="url(#sky)"/>
  <path d="M0 570 C160 500 260 640 420 560 C585 478 730 612 900 532 C1080 446 1210 558 1400 482 L1400 900 L0 900 Z" fill="url(#water)"/>
  <path d="M0 640 C172 560 300 704 464 624 C632 542 752 676 934 592 C1110 512 1234 618 1400 548" fill="none" stroke="#fffdf9" stroke-width="10" stroke-opacity="0.72"/>
  <path d="M0 720 C168 648 296 770 466 700 C634 628 772 740 950 670 C1118 604 1242 700 1400 638" fill="none" stroke="#fffdf9" stroke-width="7" stroke-opacity="0.58"/>
  <circle cx="120" cy="122" r="54" fill="#cc829a" opacity="0.92"/>
  <text x="120" y="137" text-anchor="middle" fill="#fffdf9" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-style="italic" font-weight="700">df</text>
  <text x="205" y="108" fill="#153947" font-family="Georgia, 'Times New Roman', serif" font-size="58">Feeling Words Ocean</text>
  <text x="208" y="150" fill="#657177" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Name the weather. Find the current. Choose the next gentle step.</text>

  <g filter="url(#softShadow)">
    <g transform="translate(96 232)">
      <rect width="270" height="128" rx="20" fill="#fffdf9" stroke="#e7d7c4"/>
      <text x="28" y="44" fill="#cc829a" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="900" letter-spacing="3">OPEN WATER</text>
      <text x="28" y="83" fill="#153947" font-family="Georgia, 'Times New Roman', serif" font-size="34">Joy</text>
      <text x="104" y="83" fill="#254f5c" font-family="Inter, Arial, sans-serif" font-size="17">delight, play, ease</text>
    </g>
    <g transform="translate(408 206)">
      <rect width="330" height="142" rx="20" fill="#fffdf9" stroke="#e7d7c4"/>
      <text x="28" y="44" fill="#cc829a" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="900" letter-spacing="3">HARBOR</text>
      <text x="28" y="84" fill="#153947" font-family="Georgia, 'Times New Roman', serif" font-size="34">Connection</text>
      <text x="28" y="113" fill="#254f5c" font-family="Inter, Arial, sans-serif" font-size="17">love, trust, belonging, care</text>
    </g>
    <g transform="translate(788 234)">
      <rect width="286" height="126" rx="20" fill="#fffdf9" stroke="#e7d7c4"/>
      <text x="28" y="44" fill="#cc829a" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="900" letter-spacing="3">LOW SWELL</text>
      <text x="28" y="84" fill="#153947" font-family="Georgia, 'Times New Roman', serif" font-size="34">Calm</text>
      <text x="119" y="84" fill="#254f5c" font-family="Inter, Arial, sans-serif" font-size="17">steady, safe, clear</text>
    </g>
    <g transform="translate(1116 194)">
      <rect width="220" height="156" rx="20" fill="#fffdf9" stroke="#e7d7c4"/>
      <text x="28" y="44" fill="#cc829a" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="900" letter-spacing="3">HORIZON</text>
      <text x="28" y="84" fill="#153947" font-family="Georgia, 'Times New Roman', serif" font-size="34">Hope</text>
      <text x="28" y="113" fill="#254f5c" font-family="Inter, Arial, sans-serif" font-size="17">brave, capable,</text>
      <text x="28" y="137" fill="#254f5c" font-family="Inter, Arial, sans-serif" font-size="17">encouraged</text>
    </g>
    <g transform="translate(150 430)">
      <rect width="252" height="136" rx="20" fill="#fffdf9" stroke="#e7d7c4"/>
      <text x="28" y="44" fill="#cc829a" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="900" letter-spacing="3">RAIN TIDE</text>
      <text x="28" y="84" fill="#153947" font-family="Georgia, 'Times New Roman', serif" font-size="34">Sadness</text>
      <text x="28" y="113" fill="#254f5c" font-family="Inter, Arial, sans-serif" font-size="17">grief, ache, loss</text>
    </g>
    <g transform="translate(460 446)">
      <rect width="274" height="126" rx="20" fill="#fffdf9" stroke="#e7d7c4"/>
      <text x="28" y="44" fill="#cc829a" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="900" letter-spacing="3">FOG BANK</text>
      <text x="28" y="84" fill="#153947" font-family="Georgia, 'Times New Roman', serif" font-size="34">Fear</text>
      <text x="108" y="84" fill="#254f5c" font-family="Inter, Arial, sans-serif" font-size="17">worry, dread, alert</text>
    </g>
    <g transform="translate(790 430)">
      <rect width="274" height="136" rx="20" fill="#fffdf9" stroke="#e7d7c4"/>
      <text x="28" y="44" fill="#cc829a" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="900" letter-spacing="3">ROUGH WATER</text>
      <text x="28" y="84" fill="#153947" font-family="Georgia, 'Times New Roman', serif" font-size="34">Anger</text>
      <text x="28" y="113" fill="#254f5c" font-family="Inter, Arial, sans-serif" font-size="17">boundary, heat, protest</text>
    </g>
    <g transform="translate(1116 438)">
      <rect width="222" height="138" rx="20" fill="#fffdf9" stroke="#e7d7c4"/>
      <text x="28" y="44" fill="#cc829a" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="900" letter-spacing="3">DEEP POOL</text>
      <text x="28" y="84" fill="#153947" font-family="Georgia, 'Times New Roman', serif" font-size="34">Shame</text>
      <text x="28" y="113" fill="#254f5c" font-family="Inter, Arial, sans-serif" font-size="17">small, exposed,</text>
      <text x="28" y="137" fill="#254f5c" font-family="Inter, Arial, sans-serif" font-size="17">unworthy</text>
    </g>
  </g>

  <g font-family="Inter, Arial, sans-serif" font-weight="800" fill="#153947" opacity="0.84">
    <text x="96" y="704" font-size="22">hurt</text>
    <text x="170" y="748" font-size="18">lonely</text>
    <text x="258" y="694" font-size="20">tender</text>
    <text x="368" y="760" font-size="18">overwhelmed</text>
    <text x="540" y="710" font-size="23">activated</text>
    <text x="680" y="772" font-size="18">numb</text>
    <text x="776" y="714" font-size="20">curious</text>
    <text x="896" y="778" font-size="18">grateful</text>
    <text x="1018" y="704" font-size="21">relieved</text>
    <text x="1152" y="758" font-size="18">bittersweet</text>
  </g>
  <text x="700" y="842" text-anchor="middle" fill="#657177" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800">Doctor Fab Therapeutic Lexicon</text>
</svg>
